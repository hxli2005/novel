[project]
name = "novel-to-screenplay"
version = "0.1.0"
description = "AI-assisted novel-to-screenplay conversion tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.3",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
novel2script = "novel_to_screenplay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
