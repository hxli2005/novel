[project]
name = "novel-to-screenplay"
version = "0.1.0"
description = "AI-assisted novel-to-screenplay conversion tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "jsonschema>=4.26.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
novel2script = "novel_to_screenplay.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Form", "fastapi.File", "fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
