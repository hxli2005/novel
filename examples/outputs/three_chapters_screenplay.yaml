    chapter_refs:
      - "ch_003"
    scene_heading:
      location_mode: "EXT"
      location_id: "loc_rooftop"
      display: "住院楼天台"
      time_of_day: "NIGHT"
    summary: "周叔说出旧案经过，赵岚现身施压，林青用顾明远的名字触发录音笔。"
    dramatic_function: "payoff"
    estimated_screen_time_sec: 210
    characters_present:
