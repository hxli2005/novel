      - "铜钥匙"
    beats:
      - id: "beat_001"
        summary: "林青在档案柜中找到父亲旧病历。"
        source_refs:
          - chapter_id: "ch_001"
            note: "档案室翻找病历"
      - id: "beat_002"
        summary: "她发现第七页被撕走。"
        source_refs:
          - chapter_id: "ch_001"
            note: "病历缺页"
      - id: "beat_003"
        summary: "周叔警告她停止调查，却交给她旧楼钥匙。"
        source_refs:
          - chapter_id: "ch_001"
            note: "周叔交出铜钥匙"
    script:
      - type: "action"
        text: "档案室的顶灯轻轻闪动。林青戴着手套，抽出一份泛黄病历。"
        source_refs:
          - chapter_id: "ch_001"
            note: "档案室环境和动作改写"
      - type: "action"
        text: "她翻到第七页的位置，指尖停住。纸边被撕得很整齐。"
        source_refs:
          - chapter_id: "ch_001"
            note: "第七页缺失"
      - type: "dialogue"
        character_id: "char_zhou_shu"
        character_name: "周叔"
        parenthetical: "压低声音"
        text: "别再查了，你父亲那台手术，不是你能碰的事。"
        subtext: "他知道真相，但仍害怕被牵连。"
        source_refs:
          - chapter_id: "ch_001"
            note: "周叔原文警告"
      - type: "dialogue"
        character_id: "char_lin_qing"
        character_name: "林青"
        text: "是谁撕走了第七页？"
        subtext: "她已经确认父亲旧案被人为掩盖。"
        source_refs:
          - chapter_id: "ch_001"
            note: "由追问病历缺页改写"
      - type: "action"
        text: "周叔没有回答。他把一枚生锈的铜钥匙塞进林青掌心。"
        source_refs:
          - chapter_id: "ch_001"
            note: "交出铜钥匙"
      - type: "transition"
        text: "CUT TO:"
    continuity:
      previous_scene_id: null
      next_scene_id: "sc_002"
      open_questions:
        - "电话中的人是否为赵岚或顾明远安排的人？"
    revision_status: "ai_draft"
  - id: "sc_002"
    order: 2
    chapter_refs:
