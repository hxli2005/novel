      location_id: "loc_old_pharmacy"
      display: "旧楼地下药品库"
      time_of_day: "DAY"
    summary: "林青用铜钥匙打开药品库，找到值班表和录音笔，并听见父亲留下的线索。"
    dramatic_function: "discovery"
    estimated_screen_time_sec: 180
    characters_present:
