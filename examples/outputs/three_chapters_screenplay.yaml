story_world:
  logline: "一名医生追查父亲旧案，发现缺失病历背后隐藏着医院换药真相。"
  synopsis: "林青在医院档案室发现父亲病历第七页被撕走。周叔警告她停止调查，却交给她旧楼药品库钥匙。林青在药品库找到值班表和录音笔，确认父亲生前留下证据。当晚，周叔在天台说出当年换药疑云，赵岚突然现身。林青说出顾明远的名字，录音笔播放出父亲指证顾明远换药的声音。"
  themes:
    - "真相"
    - "亲情"
    - "制度掩盖"
  setting:
    time_period: "现代"
    primary_places:
      - "江城第三医院"
  timeline_notes:
    - "三章剧情发生在连续两天内。"
characters:
  - id: "char_lin_qing"
    name: "林青"
    aliases:
      - "林医生"
    role: "protagonist"
    age: "30岁左右"
    description: "江城第三医院医生，冷静克制，正在追查父亲死亡真相。"
    motivation: "查清父亲手术旧案，并找到病历第七页背后的证据。"
    arc: "从偷偷核对档案，到主动在天台触发证据。"
    voice: "短句多，情绪压在动作和停顿里。"
    first_appearance:
      chapter_id: "ch_001"
    source_refs:
      - chapter_id: "ch_001"
        note: "档案室首次出场"
  - id: "char_zhou_shu"
    name: "周叔"
    aliases:
      - "老保安"
    role: "supporting"
    age: "60岁左右"
    description: "医院老保安，知道旧案部分真相。"
    motivation: "保护林青，同时补偿当年沉默。"
    arc: "从警告林青停止调查，到在天台说出关键线索。"
    voice: "话少，常用警告代替解释。"
    first_appearance:
      chapter_id: "ch_001"
    source_refs:
      - chapter_id: "ch_001"
        note: "交给林青铜钥匙"
      - chapter_id: "ch_003"
        note: "解释旧案"
  - id: "char_zhao_lan"
    name: "赵岚"
    role: "antagonist"
    age: "35岁左右"
    description: "顾明远的助理，负责追查林青是否拿到证据。"
    motivation: "阻止林青公开旧案真相。"
    arc: "从暗中搜查旧楼，到在天台正面施压。"
    voice: "平静、精确，带压迫感。"
    first_appearance:
      chapter_id: "ch_002"
    source_refs:
      - chapter_id: "ch_002"
        note: "旧楼搜查"
      - chapter_id: "ch_003"
        note: "天台现身"
  - id: "char_gu_mingyuan"
    name: "顾明远"
    role: "antagonist"
    age: "未知"
    description: "当年手术主刀医生，被录音指认为换药者。"
    motivation: "掩盖当年的医疗造假。"
    arc: "前三章未直接出场，但通过值班表、赵岚和录音成为核心威胁。"
    voice: "未出场，无直接对白。"
    first_appearance:
      chapter_id: "ch_002"
    source_refs:
      - chapter_id: "ch_002"
        note: "值班表中出现名字"
      - chapter_id: "ch_003"
        note: "录音指证"
  - id: "char_lin_father"
    name: "林青父亲"
    role: "minor"
    age: "未知"
    description: "林青已故父亲，当年发现顾明远伪造药品记录，并留下录音证据。"
    motivation: "在出事前把证据留给林青。"
    arc: "前三章通过录音出现，推动林青确认真相。"
    voice: "录音中声音断续，但信息直接。"
    first_appearance:
      chapter_id: "ch_002"
    source_refs:
      - chapter_id: "ch_002"
        note: "录音笔中首次出现声音"
      - chapter_id: "ch_003"
        note: "录音指证顾明远换药"
