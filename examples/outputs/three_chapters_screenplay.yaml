      - "林青遗落的手套"
    beats:
      - id: "beat_008"
        summary: "周叔承认当年顾明远伪造药品记录。"
        source_refs:
          - chapter_id: "ch_003"
            note: "周叔解释旧案"
      - id: "beat_009"
        summary: "赵岚拿着林青遗落的手套出现。"
        source_refs:
          - chapter_id: "ch_003"
            note: "赵岚天台现身"
      - id: "beat_010"
        summary: "林青说出顾明远的名字，录音笔播放关键证词。"
        source_refs:
          - chapter_id: "ch_003"
            note: "录音笔揭示真相"
    script:
      - type: "action"
        text: "天台风声很重。楼顶积水里，霓虹被吹成细碎的光。"
        source_refs:
          - chapter_id: "ch_003"
            note: "天台环境"
      - type: "dialogue"
        character_id: "char_zhou_shu"
        character_name: "周叔"
        text: "你父亲发现顾明远伪造药品记录。手术前夜，有人换掉了关键药。"
        subtext: "他终于把隐瞒多年的真相说出口。"
        source_refs:
          - chapter_id: "ch_003"
            note: "周叔解释旧案"
      - type: "dialogue"
        character_id: "char_lin_qing"
        character_name: "林青"
        text: "第七页在哪？"
        subtext: "她需要能公开指证的证据。"
        source_refs:
          - chapter_id: "ch_003"
            note: "追问第七页"
      - type: "dialogue"
        character_id: "char_zhou_shu"
        character_name: "周叔"
        text: "真正的第七页不是纸，是你手里的录音。"
        subtext: "病历缺页的伏笔被转化为录音证据。"
        source_refs:
          - chapter_id: "ch_003"
            note: "解释隐藏录音"
      - type: "action"
        text: "楼梯间的门被推开。赵岚走上天台，手里捏着林青遗落的手套。"
        source_refs:
          - chapter_id: "ch_003"
            note: "赵岚出现"
      - type: "dialogue"
        character_id: "char_zhao_lan"
        character_name: "赵岚"
        text: "林医生，顾主任想见你。"
        subtext: "她用平静语气发出威胁。"
        source_refs:
          - chapter_id: "ch_003"
            note: "赵岚原文对白"
      - type: "action"
        text: "林青没有后退。她按下录音笔。"
        source_refs:
          - chapter_id: "ch_003"
            note: "林青触发录音笔"
      - type: "dialogue"
        character_id: "char_lin_qing"
        character_name: "林青"
        text: "顾明远。"
        subtext: "她选择正面揭开真相。"
        source_refs:
          - chapter_id: "ch_003"
            note: "说出触发名字"
      - type: "voiceover"
        character_id: "char_lin_father"
        character_name: "林青父亲"
        text: "顾明远换了药。"
        source_refs:
          - chapter_id: "ch_003"
            note: "录音笔揭示真相"
    continuity:
