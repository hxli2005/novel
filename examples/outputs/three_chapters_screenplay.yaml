      - "char_zhao_lan"
    props:
      - "铜钥匙"
      - "铁盒"
      - "值班表"
      - "录音笔"
    beats:
      - id: "beat_004"
        summary: "铜钥匙打开旧楼药品库侧门。"
        source_refs:
          - chapter_id: "ch_002"
            note: "进入旧楼"
      - id: "beat_005"
        summary: "林青找到贴着手术编号的铁盒。"
        source_refs:
          - chapter_id: "ch_002"
            note: "发现铁盒"
      - id: "beat_006"
        summary: "录音笔播放父亲的断续留言。"
        source_refs:
          - chapter_id: "ch_002"
            note: "录音笔内容"
      - id: "beat_007"
        summary: "赵岚带人进入旧楼搜查。"
        source_refs:
          - chapter_id: "ch_002"
            note: "赵岚现身"
    script:
      - type: "action"
        text: "铜钥匙插进锁孔，转动时发出涩响。药品库的门开了一条缝。"
        source_refs:
          - chapter_id: "ch_002"
            note: "铜钥匙打开侧门"
      - type: "action"
        text: "林青在货架后拖出铁盒。盒盖上，是父亲当年的手术编号。"
        source_refs:
          - chapter_id: "ch_002"
            note: "发现铁盒"
      - type: "action"
        text: "铁盒里躺着一张值班表和一支录音笔。顾明远的名字被红笔圈住。"
        source_refs:
          - chapter_id: "ch_002"
            note: "值班表和录音笔"
      - type: "voiceover"
        character_id: "char_lin_father"
        character_name: "林青父亲"
        text: "如果我出事，把第七页交给林青。"
        source_refs:
          - chapter_id: "ch_002"
            note: "录音笔播放内容"
      - type: "action"
        text: "楼上传来脚步声。林青关掉录音笔，躲进药品柜后。"
        source_refs:
          - chapter_id: "ch_002"
            note: "赵岚到来前动作"
      - type: "dialogue"
        character_id: "char_zhao_lan"
        character_name: "赵岚"
        text: "东西不在这里，她已经拿走了。"
        subtext: "赵岚确认林青已取得关键证据。"
        source_refs:
          - chapter_id: "ch_002"
            note: "赵岚原文对白"
      - type: "transition"
        text: "CUT TO:"
